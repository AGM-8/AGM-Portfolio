<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artwork — AlpaGanga Movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&family=Cookie&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/edits.css">
  <link rel="stylesheet" href="css/sketchbook.css">
</head>
<body data-page="artwork">
  <canvas id="plasma" class="bg-plasma" aria-hidden="true"></canvas>
  <div class="bg-veil"></div>
  <div id="site-nav"></div>

  <main>
    <header class="page-hero wrap">
      <span class="eyebrow">05 — Sketchbook</span>
      <h1 class="page-title">Artwork</h1>
      <p class="page-lede">Graphic design, logos, illustrations, drawings and other art and design work — open the sketchbook and turn the pages.</p>
    </header>

    <section class="wrap sb-section">
      <div class="sb-toolbar">
        <div class="sb-chips" role="group" aria-label="Filter artwork">
          <button class="sb-chip active" data-filter="all" type="button">All</button>
          <button class="sb-chip" data-filter="graphic" type="button">Graphic Designing</button>
          <button class="sb-chip" data-filter="logos" type="button">Logos</button>
          <button class="sb-chip" data-filter="illustrations" type="button">Illustrations</button>
          <button class="sb-chip" data-filter="drawings" type="button">Drawings</button>
        </div>
        <p class="sb-hint">Scroll, swipe or tap a page to turn it</p>
      </div>

      <!--
        HOW TO ADD ARTWORK
        Tap the round "+" button (or the dashed "Add artwork" page inside the book),
        choose your artwork (scan, photo or exported design), give it a title and category and press "Add to sketchbook".
        Artwork is kept in this browser (IndexedDB), so they are still there after a refresh.
      -->
      <div class="sb-stage" id="sbStage" tabindex="0" aria-label="Sketchbook. Use the arrow keys, scroll, swipe or tap to turn pages.">
        <button class="sb-nav" id="sbPrev" type="button" aria-label="Previous page">&#8249;</button>
        <div class="sb-clip" id="sbClip">
          <div class="sb-book" id="sbBook"></div>
        </div>
        <button class="sb-nav" id="sbNext" type="button" aria-label="Next page">&#8250;</button>
        
        <div class="sb-status" id="sbStatus" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- upload dialog -->
  <div class="sb-modal" id="sbModal" hidden role="dialog" aria-modal="true" aria-labelledby="sbModalTitle">
    <div class="sb-sheet">
      <header>
        <h2 id="sbModalTitle">Add to sketchbook</h2>
        <button class="sb-x" type="button" data-close aria-label="Close">&times;</button>
      </header>
      <div class="sb-body">
        <label class="sb-drop" id="sbDrop" tabindex="0">
          <input type="file" id="sbFile" accept="image/*" multiple hidden>
          <b>Choose your artwork or drop it here</b>
          <small>JPG, PNG, WEBP · scans, photos or exported designs</small>
        </label>
        <ul class="sb-queue" id="sbQueue"></ul>
      </div>
      <footer>
        <button class="sb-btn ghost" type="button" data-close>Cancel</button>
        <button class="sb-btn" type="button" id="sbSave" disabled>Add to sketchbook</button>
      </footer>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/plasma.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dock.js"></script>
  <script src="js/owner.js"></script>
  <script src="js/sketchbook.js"></script>
</body>
</html>
